name: Symphony CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install UV
      run: |
        pip install uv
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Lint with flake8
      run: |
        uv run flake8 libs/ apps/ --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 libs/ apps/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Format check with black
      run: |
        uv run black --check libs/ apps/
    
    - name: Import sort check with isort
      run: |
        uv run isort --check-only libs/ apps/
    
    - name: Type check with mypy
      run: |
        uv run mypy libs/symphony-core/src/ --ignore-missing-imports
        uv run mypy libs/symphony-integrations/src/ --ignore-missing-imports
    
    - name: Test with pytest
      run: |
        uv run pytest tests/ -v --cov=symphony_core --cov=symphony_integrations --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install UV
      run: |
        pip install uv
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Integration tests
      env:
        LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run pytest tests/integration/ -v --slow
      if: env.LINEAR_API_TOKEN != '' && env.GITHUB_TOKEN != ''

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip build twine
    
    - name: Build packages
      run: |
        python -m build libs/symphony-core/
        python -m build libs/symphony-integrations/
        python -m build libs/symphony-templates/
        python -m build apps/symphony-cli/
    
    - name: Store build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-packages
        path: |
          libs/*/dist/
          apps/*/dist/

  cli-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install UV and Symphony CLI
      run: |
        pip install uv
        uv sync --all-extras --dev
    
    - name: Test CLI commands
      run: |
        ./tools/symphony --help
        ./tools/symphony status
        ./tools/symphony agent --help
        ./tools/symphony customer --help
        ./tools/symphony integration --help