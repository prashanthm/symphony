initiatives:
- description: Technical platform excellence and scalability
  level: 1
  name: Platform Excellence 2025
  sub_initiatives:
  - description: Service decomposition
    level: 2
    name: Microservices Architecture
  - description: Monitoring and observability
    level: 2
    name: Observability Platform
  - description: Internal developer tools
    level: 2
    name: Developer Experience
organization:
  customer_name: Enterprise Corp
  industry: !!python/object/apply:symphony_integrations.linear.template_models.IndustryType
  - technology
  size: !!python/object/apply:symphony_integrations.linear.template_models.OrganizationSize
  - enterprise
symphony_integration:
  agent_assignments:
    Enterprise Architecture:
    - Enterprise Orchestration Agent
    - Governance Agent
    - Compliance Monitoring Agent
    Platform Engineering:
    - Configuration Management Agent
    - Workspace Setup Agent
    - Template Generation Agent
    - Linear Integration Agent
    - Development Coordinator Agent
    - Architecture Agent
  auto_optimization: true
  automation:
    issue_creation: true
    reporting: true
    status_sync: true
    template_updates: true
  defaults_override:
    allow_customization: true
    auto_sync: true
    use_symphony_defaults: true
  recursive_improvement: false
  self_managing: false
  use_symphony_defaults: true
