[project]
name = "symphony-cli"
version = "0.1.0"
description = "Symphony CLI - Command line interface for Symphony platform"
requires-python = ">=3.9"
authors = [
    {name = "Symphony Team", email = "team@symphony.ai"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "symphony-core",
    "symphony-integrations",
    "symphony-templates", 
    "click>=8.0.0",
    "rich>=12.0.0",  # for beautiful CLI output
    "typer>=0.7.0",  # modern CLI framework
]

[tool.uv.sources]
symphony-core = { workspace = true }
symphony-integrations = { workspace = true }
symphony-templates = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-click>=1.1.0",
]

[project.scripts]
symphony = "symphony_cli.main:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"