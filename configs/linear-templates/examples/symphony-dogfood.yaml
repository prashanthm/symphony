# Symphony Dogfooding Configuration
# How Symphony uses Symphony to manage Symphony development

workspace:
  name: "Symphony Internal Operations"
  description: "Symphony uses Symphony to manage Symphony development and customer success"

organization:
  customer_name: "Symphony"
  industry: "technology"
  size: "startup"
  regions: ["global"]
  timezone: "UTC"
  locale: "en-US"

branding:
  colors:
    primary: "#6366f1"     # Symphony purple
    secondary: "#8b5cf6"   # Light purple
  logo_url: "https://symphony.ai/logo.png"

# Symphony's internal team structure
teams:
  - name: "Platform Development"
    key: "DEV"
    description: "Symphony platform development and engineering"
    workflows:
      - name: "Backlog"
        type: "backlog"
        position: 0
        description: "Development backlog"
      - name: "Planning"
        type: "unstarted"
        position: 1
        description: "Sprint planning"
      - name: "Development"
        type: "started"
        position: 2
        description: "Active development"
      - name: "Code Review"
        type: "started"
        position: 3
        description: "Peer code review"
      - name: "Testing"
        type: "started"
        position: 4
        description: "QA and testing"
      - name: "Done"
        type: "completed"
        position: 5
        description: "Completed and deployed"
    sub_teams:
      - name: "Linear Integration"
        key: "LINEAR"
        description: "Linear workspace management and hierarchy"
        workflows: []  # Inherit from parent
      - name: "Agent Ecosystem"
        key: "AGENTS"
        description: "85+ agent development and coordination"
        workflows: []  # Inherit from parent
      - name: "Configuration Systems"
        key: "CONFIG"
        description: "Template and configuration management"
        workflows: []  # Inherit from parent
    custom_fields:
      - name: "Component"
        type: "select"
        options: ["Linear", "Agents", "Config", "Core", "CLI", "Templates"]
        required: true
      - name: "Technical Complexity"
        type: "number"
        range: [1, 10]
        required: false
      - name: "Feature Priority"
        type: "select"
        options: ["P0 - Critical", "P1 - High", "P2 - Medium", "P3 - Low"]
        required: true

  - name: "Customer Success"
    key: "CS"
    description: "Symphony customer implementations and success"
    workflows:
      - name: "Discovery"
        type: "unstarted"
        position: 1
        description: "Customer needs analysis"
      - name: "Implementation"
        type: "started"
        position: 2
        description: "Symphony deployment and setup"
      - name: "Optimization"
        type: "started"
        position: 3
        description: "Performance optimization phase"
      - name: "Excellence"
        type: "completed"
        position: 4
        description: "Autonomous excellence achieved"
    custom_fields:
      - name: "Customer Tier"
        type: "select"
        options: ["Startup", "SMB", "Enterprise", "Global"]
        required: true
      - name: "Industry"
        type: "select"
        options: ["Technology", "Financial Services", "Healthcare", "Manufacturing"]
        required: true
      - name: "Success Score"
        type: "number"
        range: [1, 10]
        description: "Customer success rating"

# Symphony's strategic initiatives
initiatives:
  - name: "Symphony Platform Excellence"
    level: 1
    description: "Perfect autonomous enterprise platform development"
    owner: "CTO"
    timeline: "2025-Q4"
    sub_initiatives:
      - name: "Linear Integration Mastery"
        level: 2
        description: "Perfect configurable Linear workspace management"
        timeline: "2025-Q2"
        linked_projects: ["linear_hierarchy_implementation"]
      - name: "Agent Ecosystem Excellence"
        level: 2
        description: "85+ agent coordination perfection"
        timeline: "2025-Q3"
        linked_projects: ["agent_coordination_optimization"]
      - name: "Customer Success Optimization"
        level: 2
        description: "Perfect customer implementation workflows"
        timeline: "2025-Q4"
        linked_projects: ["customer_success_automation"]

  - name: "Dogfooding Excellence"
    level: 1
    description: "Use Symphony to build and manage Symphony"
    owner: "CEO"
    timeline: "2025-Q4"
    sub_initiatives:
      - name: "Self-Managing Systems"
        level: 2
        description: "Symphony manages its own development"
        timeline: "2025-Q2"
      - name: "Recursive Improvement"
        level: 2
        description: "System improves its own templates and processes"
        timeline: "2025-Q3"
      - name: "Meta-Optimization"
        level: 2
        description: "Optimize the optimization systems"
        timeline: "2025-Q4"

# Symphony's project templates
projects:
  - template_name: "linear_integration"
    name: "Linear ${feature_name} Implementation"
    description: "Implementation of Linear integration feature: ${feature_name}"
    assignable_teams: ["Platform Development", "Linear Integration"]
    milestones:
      - name: "Research & Design"
        description: "Research Linear APIs and design implementation"
      - name: "Core Development"
        description: "Implement core functionality"
      - name: "CLI Integration"
        description: "Add CLI commands and user interface"
      - name: "Testing & Validation"
        description: "Comprehensive testing with real Linear workspaces"
      - name: "Documentation"
        description: "Update documentation and examples"
      - name: "Deployment"
        description: "Deploy to production and customer templates"
    timeline: "6 weeks"
    custom_fields:
      - name: "Linear Feature"
        type: "select"
        options: ["Teams", "Projects", "Initiatives", "Workflows", "Custom Fields"]
        required: true

  - template_name: "customer_implementation"
    name: "${customer_name} Symphony Implementation"
    description: "Full Symphony implementation for customer: ${customer_name}"
    assignable_teams: ["Customer Success"]
    milestones:
      - name: "Discovery & Requirements"
        description: "Customer needs analysis and requirements gathering"
      - name: "Workspace Configuration"
        description: "Configure Linear workspace and Symphony agents"
      - name: "Agent Deployment"
        description: "Deploy and configure Symphony agents"
      - name: "Integration Setup"
        description: "Set up tool integrations and workflows"
      - name: "Training & Handoff"
        description: "Customer training and knowledge transfer"
      - name: "Go-Live & Support"
        description: "Production deployment and ongoing support"
    timeline: "12 weeks"
    custom_fields:
      - name: "Customer Package"
        type: "select"
        options: ["Startup", "SMB", "Enterprise", "Global"]
        required: true
      - name: "Agent Count"
        type: "number"
        range: [15, 85]
        required: true

  - template_name: "dogfooding_experiment"
    name: "Dogfooding: ${experiment_name}"
    description: "Use Symphony to ${experiment_description}"
    assignable_teams: ["Platform Development", "Customer Success"]
    milestones:
      - name: "Hypothesis"
        description: "Define what we want to test"
      - name: "Setup"
        description: "Configure Symphony for the experiment"
      - name: "Execution"
        description: "Run the dogfooding experiment"
      - name: "Analysis"
        description: "Analyze results and learnings"
      - name: "Integration"
        description: "Integrate learnings into product"
    timeline: "4 weeks"
    auto_create: true  # Automatically create these for dogfooding

# Symphony's meta-integration (Symphony managing Symphony)
symphony_integration:
  agent_assignments:
    "Platform Development":
      - "Linear Integration Agent"
      - "Configuration Management Agent"
      - "Template Generation Agent" 
      - "Code Review Agent"
      - "Testing Automation Agent"
    "Customer Success":
      - "Customer Onboarding Agent"
      - "Workspace Setup Agent"
      - "Success Tracking Agent"
      - "Implementation Coordinator Agent"
    "Linear Integration":
      - "Linear API Agent"
      - "Workspace Builder Agent"
      - "Hierarchy Manager Agent"
    "Agent Ecosystem":
      - "Agent Coordinator Agent"
      - "Performance Monitor Agent"
      - "Agent Development Agent"
  
  automation:
    issue_creation: true        # Auto-create issues from documentation
    status_sync: true          # Sync with Symphony workflows
    reporting: true            # Generate Symphony reports
    template_updates: true     # Auto-update templates based on usage
    
  defaults_override:
    use_symphony_defaults: false  # Symphony creates its own defaults
    allow_customization: true     # But allows full customization
    auto_sync: true              # Keep everything in sync
    
  # Meta-features: Symphony managing Symphony
  use_symphony_defaults: false   # Custom Symphony configuration
  custom_templates_path: "./configs/linear-templates/symphony/"
  self_managing: true           # Symphony manages its own workspace
  recursive_improvement: true   # System improves its own templates
  auto_optimization: true       # Continuous optimization

# Variables for template substitution
variables:
  global:
    customer_name: "Symphony"
    company_name: "Symphony AI"
    product_name: "Symphony Autonomous Enterprise Platform"
    
  computed:
    workspace_name: "Symphony Internal Operations"
    total_agents: 85
    dogfooding_score: 10
    
  conditional:
    is_dogfooding: true
    self_improving: true
    meta_level: "ultimate"  # Symphony managing Symphony managing customers

# Template inheritance (Symphony uses base but heavily customizes)
inherits_from:
  - "base/workspace-base"

template_version: "2025.1-dogfood"
created_by: "Symphony (self-generated)"
created_date: "2025-01-01"

# Meta-commentary: This configuration demonstrates Symphony's autonomous
# capabilities by using Symphony to manage Symphony's own development,
# customer success, and continuous improvement processes.