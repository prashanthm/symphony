template_info:
  name: "Product Requirements Document Template"
  version: "1.0"
  description: "Standard PRD template for product development"
  author: "Symphony Configuration System"
  category: "product_management"

sections:
  header:
    format: |
      # {title}
      **Product Requirements Document**
      
      - **Version:** {version}
      - **Author:** {author}
      - **Date:** {date}
      - **Status:** {status}
      
  executive_summary:
    format: |
      ## Executive Summary
      
      {executive_summary}
      
      ### Key Objectives
      {key_objectives}
      
  problem_statement:
    format: |
      ## Problem Statement
      
      ### Current Challenge
      {problem_description}
      
      ### Impact
      {impact_statement}
      
  solution_overview:
    format: |
      ## Solution Overview
      
      ### Proposed Solution
      {solution_description}
      
      ### Benefits
      {benefits_list}
      
  requirements:
    format: |
      ## Requirements
      
      ### Functional Requirements
      {functional_requirements}
      
      ### Non-Functional Requirements
      {non_functional_requirements}
      
      ### Technical Requirements
      {technical_requirements}
      
  user_stories:
    format: |
      ## User Stories
      
      {user_stories}
      
  success_metrics:
    format: |
      ## Success Metrics
      
      ### KPIs
      {kpis}
      
      ### Acceptance Criteria
      {acceptance_criteria}
      
  timeline:
    format: |
      ## Timeline & Milestones
      
      {timeline}
      
  risks_assumptions:
    format: |
      ## Risks & Assumptions
      
      ### Risks
      {risks}
      
      ### Assumptions
      {assumptions}
      
  footer:
    format: |
      ---
      
      **Generated by:** {agent_name}
      **Generated at:** {timestamp}
      **Template:** {template_name}

default_values:
  version: "1.0"
  status: "Draft"
  author: "Product Manager"
  title: "Product Requirements Document"
  executive_summary: "To be completed by Product Manager"
  key_objectives: "- Objective 1\n- Objective 2\n- Objective 3"
  problem_description: "Describe the problem this product solves"
  impact_statement: "Explain the business impact"
  solution_description: "High-level solution description"
  benefits_list: "- Benefit 1\n- Benefit 2\n- Benefit 3"
  functional_requirements: "- Requirement 1\n- Requirement 2\n- Requirement 3"
  non_functional_requirements: "- Performance requirements\n- Security requirements\n- Scalability requirements"
  technical_requirements: "- Technical constraint 1\n- Technical constraint 2"
  user_stories: "- As a [user], I want [goal] so that [benefit]\n- As a [user], I want [goal] so that [benefit]"
  kpis: "- KPI 1: Target value\n- KPI 2: Target value"
  acceptance_criteria: "- Criteria 1\n- Criteria 2"
  timeline: "- Phase 1: [Date]\n- Phase 2: [Date]\n- Launch: [Date]"
  risks: "- Risk 1: Mitigation plan\n- Risk 2: Mitigation plan"
  assumptions: "- Assumption 1\n- Assumption 2"

validation_rules:
  required_fields:
    - title
    - author
    - problem_description
    - solution_description
  min_length:
    title: 10
    problem_description: 50
    solution_description: 50
  format_checks:
    - field: user_stories
      pattern: "As a .+, I want .+ so that .+"
    - field: kpis
      pattern: ".+: .+"