template_info:
  name: "User Story Template"
  version: "1.0"
  description: "Standard user story template for development"
  author: "Symphony Configuration System"
  category: "development"

sections:
  header:
    format: |
      # {story_title}
      **User Story ID:** {story_id}
      
      - **Epic:** {epic_name}
      - **Priority:** {priority}
      - **Story Points:** {story_points}
      - **Status:** {status}
      - **Assigned To:** {assignee}
      
  user_story:
    format: |
      ## User Story
      
      As a **{user_type}**, I want {user_goal} so that {user_benefit}.
      
  description:
    format: |
      ## Description
      
      {description}
      
  acceptance_criteria:
    format: |
      ## Acceptance Criteria
      
      {acceptance_criteria}
      
  technical_details:
    format: |
      ## Technical Details
      
      ### Implementation Notes
      {implementation_notes}
      
      ### Dependencies
      {dependencies}
      
      ### API Changes
      {api_changes}
      
  testing:
    format: |
      ## Testing
      
      ### Test Scenarios
      {test_scenarios}
      
      ### Edge Cases
      {edge_cases}
      
  definition_of_done:
    format: |
      ## Definition of Done
      
      {definition_of_done}
      
  notes:
    format: |
      ## Notes
      
      {notes}
      
  footer:
    format: |
      ---
      
      **Created by:** {agent_name}
      **Created at:** {timestamp}
      **Template:** {template_name}

default_values:
  story_id: "STORY-XXX"
  priority: "Medium"
  story_points: "TBD"
  status: "Draft"
  assignee: "Unassigned"
  epic_name: "Feature Development"
  user_type: "user"
  user_goal: "accomplish a specific task"
  user_benefit: "I can achieve my objective efficiently"
  description: "Detailed description of the feature or functionality"
  acceptance_criteria: |
    - [ ] Criteria 1: Specific, measurable outcome
    - [ ] Criteria 2: Specific, measurable outcome
    - [ ] Criteria 3: Specific, measurable outcome
  implementation_notes: "Technical implementation details and considerations"
  dependencies: "- Dependency 1\n- Dependency 2"
  api_changes: "- API endpoint changes\n- Data model changes"
  test_scenarios: |
    - **Scenario 1:** Test description
    - **Scenario 2:** Test description
  edge_cases: "- Edge case 1\n- Edge case 2"
  definition_of_done: |
    - [ ] Code complete and reviewed
    - [ ] Unit tests written and passing
    - [ ] Integration tests passing
    - [ ] Documentation updated
    - [ ] Acceptance criteria met
  notes: "Additional notes and considerations"

validation_rules:
  required_fields:
    - story_title
    - user_type
    - user_goal
    - user_benefit
    - acceptance_criteria
  format_checks:
    - field: acceptance_criteria
      pattern: "- \\[ \\]"
    - field: story_id
      pattern: "^[A-Z]+-\\d+$"
  story_points_values:
    - "1"
    - "2"
    - "3"
    - "5"
    - "8"
    - "13"
    - "TBD"
  priority_values:
    - "Critical"
    - "High"
    - "Medium"
    - "Low"