[project]
name = "symphony-integrations"
version = "0.1.0"
description = "Symphony Integrations - External tool integrations for Linear, GitHub, Slack, etc."
requires-python = ">=3.9"
authors = [
    {name = "Symphony Team", email = "team@symphony.ai"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "symphony-core",
    "aiohttp>=3.8.0",
    "requests>=2.28.0", 
    "slack-sdk>=3.19.0",
    "PyGithub>=1.57.0",
]

[tool.uv.sources]
symphony-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.22.0",  # for mocking HTTP requests
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"