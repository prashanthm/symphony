# Symphony Customer Configuration Schema
# This schema defines the structure for all customer configurations

schema_version: "2025.1"
description: "Comprehensive customer configuration management for Symphony autonomous enterprise deployments"

# Customer Configuration Structure
customer_config:
  # Basic customer information
  customer_profile:
    organization_name: 
      type: "string"
      required: true
      description: "Official customer organization name"
    
    customer_id: 
      type: "string" 
      required: true
      pattern: "^[a-z0-9-]+$"
      description: "Unique identifier for customer (lowercase, hyphens allowed)"
    
    industry:
      type: "enum"
      required: true
      values: ["startup", "smb", "enterprise", "global"]
      description: "Customer organization scale/type"
    
    business_domain:
      type: "string"
      required: true
      description: "Primary business domain (e.g., fintech, healthcare, ecommerce)"
    
    team_size:
      type: "integer"
      required: true
      description: "Current team size"
    
    implementation_timeline:
      type: "string"
      required: true
      description: "Expected implementation timeline (e.g., '4-6 weeks')"

  # Business objectives and success metrics
  business_objectives:
    primary_challenges:
      type: "array"
      items: "string"
      required: true
      description: "List of primary business challenges to address"
    
    success_metrics:
      efficiency_improvement:
        type: "string"
        description: "Target operational efficiency improvement percentage"
      
      cost_reduction:
        type: "string" 
        description: "Target cost reduction percentage"
      
      revenue_growth:
        type: "string"
        description: "Target revenue growth percentage"
      
      customer_satisfaction:
        type: "string"
        description: "Target customer satisfaction score"

  # Technical environment and integrations
  technical_environment:
    deployment_preference:
      type: "enum"
      values: ["saas", "onpremise", "hybrid"]
      required: true
      description: "Preferred deployment model"
    
    existing_tools:
      project_management:
        type: "string"
        description: "Current project management tool"
      
      development:
        type: "string"
        description: "Current development platform"
      
      communication:
        type: "string"
        description: "Current communication platform"
      
      crm:
        type: "string"
        description: "Current CRM system"
      
      financial:
        type: "string"
        description: "Current financial management system"

  # Operational constraints and requirements
  operational_constraints:
    compliance_requirements:
      type: "array"
      items: 
        type: "enum"
        values: ["sox", "gdpr", "hipaa", "pci-dss", "iso27001", "none"]
      description: "Required compliance standards"
    
    security_requirements:
      type: "enum"
      values: ["standard", "enhanced", "custom"]
      required: true
      description: "Security requirement level"
    
    integration_constraints:
      type: "array"
      items:
        type: "enum"
        values: ["api_access", "vpn_required", "airgapped", "none"]
      description: "Integration constraint requirements"

  # Agent configuration
  agent_configuration:
    selected_package:
      type: "enum"
      values: ["startup", "smb", "enterprise", "global"]
      required: true
      description: "Selected agent package type"
    
    custom_agents:
      type: "array"
      items: "string"
      description: "List of custom agents required beyond package defaults"
    
    agent_schedules:
      morning_start:
        type: "string"
        default: "6:00 AM EST"
        description: "Morning operations start time"
      
      midday_optimization:
        type: "string"
        default: "12:00 PM EST"
        description: "Midday optimization time"
      
      evening_planning:
        type: "string"
        default: "6:00 PM EST"
        description: "Evening planning time"

  # Integration credentials and configuration
  integrations:
    linear:
      enabled: 
        type: "boolean"
        default: true
      
      api_token:
        type: "string"
        secure: true
        description: "Linear API token (encrypted)"
      
      workspace_id:
        type: "string"
        description: "Linear workspace identifier"
    
    github:
      enabled:
        type: "boolean"
        default: true
      
      api_token:
        type: "string"
        secure: true
        description: "GitHub API token (encrypted)"
      
      organization:
        type: "string"
        description: "GitHub organization name"
    
    slack:
      enabled:
        type: "boolean"
        default: false
      
      bot_token:
        type: "string"
        secure: true
        description: "Slack bot token (encrypted)"
      
      workspace_id:
        type: "string"
        description: "Slack workspace identifier"
    
    hubspot:
      enabled:
        type: "boolean"
        default: false
      
      api_key:
        type: "string"
        secure: true
        description: "HubSpot API key (encrypted)"
    
    quickbooks:
      enabled:
        type: "boolean"
        default: false
      
      client_id:
        type: "string"
        secure: true
        description: "QuickBooks client ID (encrypted)"
      
      client_secret:
        type: "string"
        secure: true
        description: "QuickBooks client secret (encrypted)"

  # Monitoring and analytics configuration
  monitoring:
    performance_targets:
      agent_success_rate:
        type: "number"
        default: 99.5
        description: "Target agent success rate percentage"
      
      handoff_success_rate:
        type: "number"
        default: 99.0
        description: "Target handoff success rate percentage"
      
      response_time:
        type: "number"
        default: 5
        description: "Target response time in seconds"
      
      customer_satisfaction:
        type: "number"
        default: 4.9
        description: "Target customer satisfaction score (out of 5)"
    
    alert_thresholds:
      performance_degradation:
        type: "number"
        default: 90
        description: "Alert when performance drops below this percentage"
      
      error_rate:
        type: "number"
        default: 1
        description: "Alert when error rate exceeds this percentage"

# Package definitions
packages:
  startup:
    agents: 14
    pricing_range: "$2,000-8,000/month"
    implementation_time: "1-2 weeks"
    description: "Essential agents for small businesses and startups"
    included_agents:
      - "maestro/ultimate-coordinator"
      - "specialists/business-analyst"
      - "leads/technical-lead"
      - "managers/operations-manager"
  
  smb:
    agents: 35
    pricing_range: "$15,000-35,000/month"
    implementation_time: "4-6 weeks"
    description: "Extended functionality for growing companies"
    includes_startup: true
    additional_agents: 20
  
  enterprise:
    agents: 65
    pricing_range: "$50,000+/month"
    implementation_time: "12-16 weeks"
    description: "Full business operations for large enterprises"
    includes_smb: true
    additional_agents: 30
  
  global:
    agents: 85
    pricing_range: "Enterprise+ pricing"
    implementation_time: "20-24 weeks"
    description: "Complete autonomous enterprise for global operations"
    includes_enterprise: true
    additional_agents: 20

# Configuration validation rules
validation:
  required_fields:
    - "customer_profile.organization_name"
    - "customer_profile.customer_id"
    - "customer_profile.industry"
    - "business_objectives.primary_challenges"
    - "technical_environment.deployment_preference"
    - "operational_constraints.security_requirements"
    - "agent_configuration.selected_package"
  
  business_rules:
    - "customer_id must be unique across all customers"
    - "implementation_timeline must align with selected package"
    - "compliance_requirements must match security_requirements level"
    - "selected_package must support required agent count"