# Startup Package Configuration
# 15 agents, $2K-8K/month, 1-2 week implementation

package_info:
  name: "startup"
  description: "Essential agents for small businesses and startups"
  agent_count: 15
  pricing_range: "$2,000-8,000/month"
  implementation_time: "1-2 weeks"
  target_customers: "Small businesses, startups, solopreneurs"

# Agent allocation for startup package
agents:
  # Core coordination (2 agents)
  coordination:
    - agent: "maestro/ultimate-coordinator"
      role: "Supreme orchestration"
      priority: "critical"
    
    - agent: "coordinators/startup-orchestrator"
      role: "Startup-focused coordination"
      priority: "high"

  # Essential leadership (3 agents)
  leadership:
    - agent: "leads/technical-lead"
      role: "Technical guidance"
      priority: "high"
    
    - agent: "managers/operations-manager"
      role: "Operations management"
      priority: "high"
    
    - agent: "managers/project-manager"
      role: "Project coordination"
      priority: "medium"

  # Core specialists (10 agents)
  specialists:
    - agent: "specialists/business-analyst"
      role: "Business analysis"
      priority: "high"
    
    - agent: "specialists/customer-success"
      role: "Customer relationships"
      priority: "high"
    
    - agent: "specialists/financial-analyst"
      role: "Financial tracking"
      priority: "high"
    
    - agent: "specialists/marketing-coordinator"
      role: "Marketing activities"
      priority: "medium"
    
    - agent: "specialists/sales-coordinator"
      role: "Sales process"
      priority: "medium"
    
    - agent: "specialists/hr-coordinator"
      role: "Human resources"
      priority: "medium"
    
    - agent: "specialists/compliance-monitor"
      role: "Basic compliance"
      priority: "medium"
    
    - agent: "specialists/data-analyst"
      role: "Data insights"
      priority: "medium"
    
    - agent: "specialists/content-creator"
      role: "Content development"
      priority: "low"
    
    - agent: "specialists/process-optimizer"
      role: "Process improvement"
      priority: "low"

# Default configuration values for startup customers
default_configuration:
  business_objectives:
    efficiency_improvement: "50%"
    cost_reduction: "30%"
    revenue_growth: "25%"
    customer_satisfaction: "4.5/5"
  
  technical_environment:
    deployment_preference: "saas"
    recommended_integrations:
      - "linear"
      - "github"
      - "slack"
  
  operational_constraints:
    security_requirements: "standard"
    compliance_requirements: ["none"]
  
  agent_configuration:
    performance_targets:
      agent_success_rate: 95.0
      handoff_success_rate: 90.0
      response_time: 10
      customer_satisfaction: 4.5
  
  monitoring:
    alert_thresholds:
      performance_degradation: 85
      error_rate: 5
    
    reporting_frequency:
      daily_reports: true
      weekly_summaries: true
      monthly_assessments: true

# Implementation timeline for startup package
implementation:
  week1:
    - "Environment setup and configuration"
    - "Core agent deployment (Maestro, coordinators)"
    - "Linear and GitHub integration"
    - "Basic workflow configuration"
  
  week2:
    - "Specialist agent deployment"
    - "Integration testing and optimization"
    - "Training and knowledge transfer"
    - "Go-live and monitoring setup"

# Success metrics and validation criteria
success_criteria:
  - "All 15 agents operational within 2 weeks"
  - "Core business processes automated"
  - "Basic reporting and analytics functional"
  - "Customer satisfaction >= 4.5/5"
  - "System reliability >= 95%"

# Support and maintenance
maintenance:
  support_level: "standard"
  update_schedule: "monthly"
  performance_reviews: "quarterly"
  
  included_services:
    - "Basic monitoring and alerting"
    - "Monthly performance reports"
    - "Standard customer support"
    - "Basic customization options"

# Expansion path to SMB package
expansion_path:
  next_package: "smb"
  upgrade_triggers:
    - "Team size > 25 people"
    - "Revenue > $1M annually"
    - "Need for advanced integrations"
    - "Complex compliance requirements"
  
  additional_agents_preview:
    - "Advanced financial modeling"
    - "Enhanced security monitoring"
    - "Multi-channel marketing automation"
    - "Advanced analytics and reporting"