# Ultimate Coordinator Agent Settings

# Agent Identity
agent_id: ultimate-coordinator
name: Ultimate Coordinator
version: "1.0.0"
category: maestro
role: Supreme Platform Commander

# Operational Settings
schedule:
  morning_start: "6:00 AM EST"
  midday_optimization: "12:00 PM EST"
  evening_planning: "6:00 PM EST"
  timezone: "EST"
  enabled: true
  continuous_monitoring: true

# Performance Configuration
performance:
  max_concurrent_tasks: 50
  max_context_memory: 200
  max_token_context: 1000
  response_timeout: 30.0  # seconds
  handoff_timeout: 60.0   # seconds
  
# Thresholds
thresholds:
  success_rate: 99.5
  response_time: 5.0
  handoff_success: 99.0
  platform_uptime: 99.9
  coordination_latency: 100.0
  conflict_resolution_time: 30.0
  quality_gate_success: 99.8

# Agent Registry Configuration
registry:
  categories:
    - maestro
    - coordinators  
    - leads
    - managers
    - specialists
  authority_levels:
    maestro: supreme
    coordinators: strategic
    leads: technical
    managers: operational
    specialists: domain

# Monitoring Configuration
monitoring:
  health_check_interval: 30  # seconds
  performance_monitoring: true
  coordination_tracking: true
  quality_assurance: true
  dashboard_updates: true

# Integration Settings
integrations:
  agent_manager: true
  coordination_hub: true
  performance_monitor: true
  quality_gateway: true
  emergency_response: true