[project]
name = "symphony"
version = "0.1.0"
description = "Symphony Autonomous Enterprise Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Symphony Team", email = "team@symphony.ai"},
]
license = {text = "MIT"}
keywords = ["autonomous", "enterprise", "ai", "agents", "coordination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "asyncio-mqtt>=0.11.0",
    "click>=8.0.0",
    "rich>=14.1.0",
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "isort>=5.10.0",
]
cli = ["symphony-cli"]
integrations = ["symphony-integrations"]
templates = ["symphony-templates"]
all = ["symphony-cli", "symphony-integrations", "symphony-templates", "symphony-core"]

[tool.uv.sources]
symphony-core = { workspace = true }
symphony-integrations = { workspace = true }
symphony-templates = { workspace = true }
symphony-cli = { workspace = true }

[project.scripts]
symphony = "symphony_cli.main:cli"

[tool.uv.workspace]
members = [
    "libs/symphony-core",
    "libs/symphony-integrations", 
    "libs/symphony-templates",
    "apps/symphony-cli"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Root package is just a workspace coordinator - no packages to build
[tool.setuptools]
py-modules = []

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
